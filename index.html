<body>

    <div class="history-sidebar">
        <div class="history-header">

                        <div class="player-id-manage-row" id="player-id-manage-row" style="display: none; margin: 0;">

                            <input type="text" id="pid-id-input" placeholder="ID (例: cc0db7)" maxlength="6"

            </div>
            <div id="progress-container">
                <div id="progress-bar-wrapper">
                    <div id="progress-bar"></div>

                <span id="progress-text">準備中...</span>
            </div>
        </div>
        <details class="save-share-panel">
            <summary>保存・共有</summary>
            <div class="save-share-content">
                <div class="webhook-settings">

                    <input type="url" id="webhook-url-input" placeholder="https://discord.com/api/webhooks/...">
                    <button id="webhook-save-btn">保存</button>

        <p id="hyperion-transfer-status" role="status" aria-live="polite" hidden></p>

    <script src="./hyperion-transfer.js?v=20260909-1"></script>
    <script>
        // --- 色と柄の定数マッピング ---
        const COLOR_MAP = {
            "黄": "#efe70a", "金": "#a37900", "銀": "#6e7f7f", "黒": "#262626", "紫": "#7817f6", "水": "#23bfe9",
            "青": "#0f2eec", "赤": "#e6130b", "桃": "#fa4789", "濃黄": "#e8be14", "濃金": "#696900", "濃銀": "#566262",
            "濃黒": "#191919", "濃紫": "#320296", "濃水": "#1180a7", "濃青": "#142591", "濃赤": "#b50d0d", "濃桃": "#be2655",
            "濃白": "#beb4aa", "濃緑": "#307a2a", "濃橙": "#d15f0b", "白": "#d8d0c8", "薄黄": "#f0ef6e", "薄金": "#b4b428",
            "薄銀": "#96b4c6", "薄黒": "#3c3c3c", "薄紫": "#b45ef8", "薄水": "#80e5ee", "薄青": "#5382fb", "薄赤": "#f43246",
            "薄桃": "#fea0cf", "薄白": "#f5f5c8", "薄緑": "#73e46d", "薄橙": "#f5a72c", "緑": "#1fc448", "橙": "#fd711f",
            // 旧履歴との互換表記
            "黄色": "#efe70a", "水色": "#23bfe9", "濃黄色": "#e8be14", "濃水色": "#1180a7", "薄黄色": "#f0ef6e", "薄水色": "#80e5ee",
            "通常黒": "#262626", "通常赤": "#e6130b", "通常水色": "#23bfe9", "通常緑": "#1fc448", "通常橙": "#fd711f", "通常黄色": "#efe70a",
            "通常青": "#0f2eec", "通常白": "#d8d0c8", "通常紫": "#7817f6", "通常桃": "#fa4789", "通常金": "#a37900", "通常銀": "#6e7f7f"
        };
        const PATTERN_RANK_MAP = { 'なし': 'D(単色)', 'ツートン': 'C', 'ボーダー': 'C', 'ストライプ': 'C', '水玉': 'C', 'アニマル': 'C', '斜めボーダー': 'C', 'ギンガムチェック': 'B', 'ダイヤ': 'B', '鱗文': 'B', 'シェブロン': 'B', 'バブルドット': 'B', 'スペード': 'B', 'ピンドット': 'A', 'レンガ': 'A', 'スプラッシュ': 'A', 'マーブル': 'A', 'ヘビ': 'A', 'しずく': 'A', 'うろこ': 'A', 'トラ': 'S', '花': 'S', '星': 'S' };

        // =============================================================
        // --- IndexedDB ヘルパー ---
        // =============================================================
        const IDB_NAME = 'kakeizuApp';
        const IDB_VERSION = 1;
        const STORE_HISTORY = 'history';
        const STORE_CACHE = 'rsidCache';

        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(IDB_NAME, IDB_VERSION);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_HISTORY)) {
                        db.createObjectStore(STORE_HISTORY, { keyPath: 'key' });
                    }
                    if (!db.objectStoreNames.contains(STORE_CACHE)) {
                        db.createObjectStore(STORE_CACHE, { keyPath: 'key' });
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function migrateFromIndexedDB() {
            try {
                if (localStorage.getItem('idb_to_local_migrated') === 'true') return;
                const db = await openDB();
                
                await new Promise((resolve) => {
                    const txHistory = db.transaction(STORE_HISTORY, 'readonly');
                    const storeHistory = txHistory.objectStore(STORE_HISTORY);
                    const reqHistory = storeHistory.get('main');
                    reqHistory.onsuccess = () => {
                        if (reqHistory.result && reqHistory.result.data) {
                            if (!localStorage.getItem('rsidHistory')) {
                                localStorage.setItem('rsidHistory', JSON.stringify(reqHistory.result.data));
                            }
                        }
                        resolve();
                    };
                    reqHistory.onerror = () => resolve();
                });

                await new Promise((resolve) => {
                    const txCache = db.transaction(STORE_CACHE, 'readonly');
                    const storeCache = txCache.objectStore(STORE_CACHE);
                    const reqCache = storeCache.get('main');
                    reqCache.onsuccess = () => {
                        if (reqCache.result && reqCache.result.data) {
                            if (!localStorage.getItem('rsidConversionCache')) {
                                localStorage.setItem('rsidConversionCache', JSON.stringify(reqCache.result.data));
                            }
                        }
                        resolve();
                    };
                    reqCache.onerror = () => resolve();
                });
                
                localStorage.setItem('idb_to_local_migrated', 'true');
            } catch (e) {
                console.error('データのマイグレーションに失敗しました:', e);
            }
        }

        // --- 履歴管理 (IndexedDB) ---
        const MAX_HISTORY = 50; // 最大保存件数
        let currentActiveHistoryId = null;
        let activeHyperion = null;
        let hyperionNavigationVersion = 0;

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        /**
         * IndexedDBから履歴配列を取得する
         * @returns {Promise<Array<{id: string, name: string, data: string, date: string}>>}
         */
        function getHistory() {
            try {
                const data = localStorage.getItem('rsidHistory');
                return data ? JSON.parse(data) : [];
            } catch (e) {
                return [];
            }
        }

        /**
         * 履歴をlocalStorageに保存（または更新）する
         * @param {string} championName - チャンピオン名
         * @param {string} rsidData - RSIDテキストデータ
         * @param {string} [statusText] - アンテナや柄などのステータス文字列
         */
        function saveToHistory(championName, rsidData, statusText) {
            const history = getHistory();
            const now = new Date();
            const dateStr = `${now.getFullYear()}/${(now.getMonth() + 1).toString().padStart(2, '0')}/${now.getDate().toString().padStart(2, '0')} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            // すでにアクティブな履歴がある場合はそれを更新
            let existingIndex = -1;
            if (currentActiveHistoryId) {
                existingIndex = history.findIndex(h => h.id === currentActiveHistoryId);
            }

            if (existingIndex !== -1) {
                // 既存の履歴を更新
                history[existingIndex].name = championName || history[existingIndex].name;
                if (history[existingIndex].data !== rsidData) {
                    history[existingIndex].data = rsidData;
                    delete history[existingIndex].convertedPlayerId;
                }
                history[existingIndex].date = dateStr; // 更新日時を更新
                history[existingIndex].image = null; // 画像は保存しない
                if (statusText !== undefined) {
                    history[existingIndex].statusText = statusText;
                }
            } else {
                // 新規作成
                const entry = {
                    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                    name: championName,
                    data: rsidData,
                    date: dateStr,
                    image: null,
                    statusText: statusText || null
                };
                currentActiveHistoryId = entry.id; // アクティブにする
                history.unshift(entry);
            }

            const savedEntry = history.find(h => h.id === currentActiveHistoryId);
            if (activeHyperion && savedEntry) savedEntry.hyperion = { binaryId: activeHyperion.binaryId, appearanceComplete: activeHyperion.parsed.appearanceComplete };

            // 最大件数を超えたら古いものを削除
            if (history.length > MAX_HISTORY) {
                history.splice(MAX_HISTORY);
            }

            try {
                localStorage.setItem('rsidHistory', JSON.stringify(history));
            } catch (e) {
                console.error('履歴の保存に失敗しました:', e);
                alert('ブラウザの容量不足のため、履歴を保存できませんでした。不要な履歴を削除してください。');
                return false;
            }
            renderHistoryList();
            void HyperionTransfer.collect(history);
            return true;
        }

        /**
         * 指定IDの履歴を削除する
         * @param {string} entryId
         */
        function deleteHistoryEntry(entryId) {
            let history = getHistory();
            history = history.filter(h => h.id !== entryId);
            if (currentActiveHistoryId === entryId) {
                currentActiveHistoryId = null;
            }
            localStorage.setItem('rsidHistory', JSON.stringify(history));
            renderHistoryList();
            void HyperionTransfer.collect(history);
        }

        /**
         * 全履歴を削除する
         */
        function clearAllHistory() {
            localStorage.removeItem('rsidHistory');
            currentActiveHistoryId = null;
            renderHistoryList();
            void HyperionTransfer.collect([]);
        }

        /**
         * 履歴項目を選択してRSIDをテキストエリアに読み込む
         * @param {string} entryId
         */
        function saveConvertedPlayerIdToHistory(entryId, playerIdHex) {
            const history = getHistory();
            const existingIndex = history.findIndex(h => h.id === entryId);
            if (existingIndex !== -1) {
                history[existingIndex].convertedPlayerId = playerIdHex;
                localStorage.setItem('rsidHistory', JSON.stringify(history));
            }
        }

        function restoreConversionState(playerIdHex) {
            const errorEl = document.getElementById('error-message');
            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');
            const convertBtn = document.getElementById('convert-rsid-btn');
            const spinner = document.getElementById('spinner');

            // プレイヤーIDの入力と選択状態を更新
            document.getElementById('player-id-input').value = playerIdHex;
            const select = document.getElementById('player-id-select');
            let optionExists = false;
            for (let i = 0; i < select.options.length; i++) {
                if (select.options[i].value === playerIdHex) {
                    select.value = playerIdHex;
                    optionExists = true;
                    break;
                }
            }
            if (optionExists) {
                document.getElementById('pid-del-btn').style.display = 'block';
            } else {
                select.value = '';
                document.getElementById('pid-del-btn').style.display = 'none';
            }

            // キャッシュから変換データを取得して適用
            let cache; try { cache = JSON.parse(localStorage.getItem('rsidConversionCache')); } catch(e){} if(!cache) cache = {};
            if (!cache) cache = {};

            const convertedResults = [];
            for (const round of currentRoundsData) {
                for (const node of round) {
                    if (!node.participants || node.participants.length === 0) {
                        const rsidForConversion = node.originalId || node.id;
                        if (!rsidForConversion) continue;

                        const cacheKey = `${playerIdHex}_${rsidForConversion}`;
                        if (cache[cacheKey]) {
                            convertedResults.push({ uniqueId: node.uniqueId, newId: cache[cacheKey], id: rsidForConversion });
                        }
                    }
                }
            }

            if (convertedResults.length > 0) {
                // 結果を反映
                for (const result of convertedResults) {
                    if (result.newId) {
                        const cardEl = document.getElementById(result.uniqueId);
                        if (cardEl) {
                            const rsidTextEl = cardEl.querySelector('.rsid-text');
                            if (rsidTextEl) {
                                rsidTextEl.textContent = result.newId;
                            }
                            const qrEl = cardEl.querySelector('.qr-code');
                            if (qrEl) {
                                qrEl.innerHTML = '';
                                qrEl.dataset.id = result.newId;
                                const alphanumericOnlyId = result.newId.replace(/[^a-zA-Z0-9]/g, '');
                                new QRCode(qrEl, {
                                    text: alphanumericOnlyId,
                                    width: 150,
                                    height: 150
                                });
                            }
                        }
                    }
                }

                // UI表示を完了状態にする
                progressContainer.style.display = 'block';
                progressBar.style.width = '100%';
                progressText.textContent = '変換完了';
                spinner.style.display = 'none';
                convertBtn.disabled = false;
                errorEl.style.color = '#3ce4c8';
                errorEl.textContent = '全QRコードの変換が完了しました';
                errorEl.style.display = 'block';
            }
        }

        // 履歴読み込み中フラグ（重複保存防止）
        let isLoadingFromHistory = false;

        async function loadHistoryEntry(entryId) {
            const history = getHistory();
            const entry = history.find(h => h.id === entryId);
            if (!entry) return;

            const navigation = ++hyperionNavigationVersion;
            let binary = null;
            if (entry.hyperion) {
                try {
                    binary = { binaryId: entry.hyperion.binaryId, parsed: await HyperionTransfer.model(entry.hyperion.binaryId) };
                    if (entry.data.trim() !== binary.parsed.treeText.trim()) throw new Error('履歴の文字列とバイナリが一致しません。');
                } catch (error) { HyperionTransfer.status(error.message, true); return; }
            }
            if (navigation !== hyperionNavigationVersion) return;
            activeHyperion = binary;
            HyperionTransfer.setActiveBinary(binary?.binaryId);

            // 変換UIの状態を完全にリセット（前の家系図の変換状態を引き継がない）
            resetConversionUI();

            currentActiveHistoryId = entryId;

            // テキストエリアに反映
            const textarea = document.getElementById('rsid-input');
            textarea.value = entry.data || "";
            textarea.style.height = 'auto';
            textarea.style.height = `${textarea.scrollHeight}px`;

            // フラグを立てて自動生成（再保存を防止）
            isLoadingFromHistory = true;
            if (entry.data) {
                document.getElementById('generate-btn').click();

                // 折り畳み状態を復元
                if (entry.collapsedNodes && entry.collapsedNodes.length > 0) {
                    entry.collapsedNodes.forEach(nodeId => {
                        const el = document.getElementById(nodeId);
                        if (el) {
                            el.dataset.collapsed = 'true';
                            addBirthCompleteLabel(el);
                        }
                    });
                    updateAllVisibility(nodesMap);
                }

                // 以前に変換完了していた場合、自動的にキャッシュから変換を適用してUIを維持する
                if (entry.convertedPlayerId) {
                    restoreConversionState(entry.convertedPlayerId);
                }
            } else {
                // データが空ならクリアのみ
                document.getElementById('clear-btn').click();
            }
            renderHistoryList(); // activeクラスをつけるため
        }

        let historyFaceObserver = null;
        let historyFaceRenderGeneration = 0;
        const historyFaceJobs = new WeakMap();

        function renderHistoryFaceThumbnail(canvas, statusText, generation) {
            const indicator = canvas.closest('.color-indicator');
            if (!indicator) return;
            if (!statusText) {
                indicator.classList.add('is-unavailable');
                indicator.title = 'この履歴には顔情報がありません';
                return;
            }

            indicator.classList.add('is-loading');
            window.DenpamenFaceRenderer.renderThumbnail(canvas, statusText, { size: 96 })
                .then(() => {
                    if (generation !== historyFaceRenderGeneration || !canvas.isConnected) return;
                    indicator.classList.remove('is-loading', 'is-error');
                })
                .catch(error => {
                    if (generation !== historyFaceRenderGeneration || !canvas.isConnected) return;
                    console.error('履歴の顔サムネイル描画に失敗しました。', error);
                    indicator.classList.remove('is-loading');
                    indicator.classList.add('is-error');
                    indicator.title = error.message;
                });
        }

        function observeHistoryFaceThumbnail(canvas, statusText, generation) {
            if (!statusText) {
                renderHistoryFaceThumbnail(canvas, statusText, generation);
                return;
            }
            if (!historyFaceObserver) {
                renderHistoryFaceThumbnail(canvas, statusText, generation);
                return;
            }
            historyFaceJobs.set(canvas, { statusText, generation });
            historyFaceObserver.observe(canvas);
        }

        /**
         * サイドバーの履歴リストを再描画する
         */
        function renderHistoryList() {
            const listEl = document.getElementById('history-list');
            const emptyEl = document.getElementById('history-empty');
            const history = getHistory();

                const hexColors = colors.map(c => COLOR_MAP[c] || COLOR_MAP['通常' + c] || '#3a3a50');
                if (hexColors.length === 1) {

                    return `linear-gradient(135deg, ${hexColors[0]} 50%, ${hexColors[1]} 50%)`; // 2色を対角線でクッキリ分ける
                }
                const stops = [];
                const step = 100 / hexColors.length;
                for (let i = 0; i < hexColors.length; i++) {
                    const start = i * step;
                    const end = (i + 1) * step;
                    stops.push(`${hexColors[i]} ${start}%`);

        function parseNode(str) {
            str = str.trim();
            if (!str.startsWith("(")) {
                const parts = str.split(/\s+/);
                let id = parts.shift();
                let name = parts.join(" ");
                if (!name && !HyperionCore.normalRsid(id)) {
                    name = id;
                    id = "";
                }
                if (!name) name = id;
                return { id, name, participants: [] };
            }
            let balance = 0, end = -1;
            for (let i = 0; i < str.length; i++) {
                if (str[i] === "(") balance++;
                else if (str[i] === ")") balance--;
                if (balance === 0) { end = i; break; }
            }
            if (end === -1) throw new Error("括弧の対応が正しくありません。");
            const winner = str.substring(end + 1).trim();
            const inside = str.substring(1, end).trim();
            let depth = 0, split = -1;
            for (let i = 0; i < inside.length; i++) {
                if (inside[i] === "(") depth++;
                else if (inside[i] === ")") depth--;
                else if (inside[i] === "+" && depth === 0) { split = i; break; }
            }
            if (split === -1) throw new Error("'+' 区切りが見つかりません。");
            const left = inside.substring(0, split).trim();
            const right = inside.substring(split + 1).trim();
            return { name: winner, participants: [parseNode(left), parseNode(right)], id: null };
        }

        function drawLines(rounds) {
            if (!rounds || rounds.length === 0) return;
            const container = document.getElementById('bracket-container');
            const svg = document.getElementById('bracket-lines');
            svg.innerHTML = '';
            svg.setAttribute('width', container.scrollWidth);
            svg.setAttribute('height', container.scrollHeight);

            function getElementPosition(id) {
                const el = document.getElementById(id);
                if (!el || el.classList.contains('collapsed')) return null;
                const containerRect = container.getBoundingClientRect();
                const elRect = el.getBoundingClientRect();
                return {
                    id: id,
                    cx: elRect.left - containerRect.left + container.scrollLeft + elRect.width / 2,
                    top: elRect.top - containerRect.top + container.scrollTop,
                    bottom: elRect.top - containerRect.top + container.scrollTop + elRect.height,
                };
            }

            function connectCards(fromIds, toId, delay, pairIndex = 0, totalPairsInRound = 1) {
                const toPos = getElementPosition(toId);
                if (!toPos) return;

                const fromPositions = fromIds.map(getElementPosition).filter(Boolean);
                if (fromPositions.length === 0) return;

                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");

                path.id = `path-for-${toId}`;

                let pathData = "";
                fromPositions.sort((a, b) => a.cx - b.cx);

                if (fromPositions.length === 2) {
                    const leftParentPos = fromPositions[0];
                    const rightParentPos = fromPositions[1];

                    const leftParentEl = document.getElementById(leftParentPos.id);
                    const rightParentEl = document.getElementById(rightParentPos.id);

                    let anchorParentPos = leftParentPos;
                    if (leftParentEl && rightParentEl) {
                        const leftHasQr = leftParentEl.querySelector('.qr-code') !== null;
                        const rightHasQr = rightParentEl.querySelector('.qr-code') !== null;
                        if (leftHasQr && !rightHasQr) {
                            anchorParentPos = rightParentPos;
                        } else if (!leftHasQr && rightHasQr) {
                            anchorParentPos = leftParentPos;
                        }
                    }

                    const parentCenterY = anchorParentPos.top + (anchorParentPos.bottom - anchorParentPos.top) / 2;
                    const midX = (leftParentPos.cx + rightParentPos.cx) / 2;

                    pathData += `M ${leftParentPos.cx},${parentCenterY} L ${rightParentPos.cx},${parentCenterY} `;

                    const baseOffsetY = 120;
                    const maxAvailableSpace = 80;
                    const spacing = totalPairsInRound > 1 ? maxAvailableSpace / (totalPairsInRound - 1) : 0;
                    const yOffset = baseOffsetY - (pairIndex * spacing);
                    const verticalDropY = toPos.top - yOffset;

                    pathData += `M ${midX},${parentCenterY} L ${midX},${verticalDropY} `;
                    pathData += `L ${toPos.cx},${verticalDropY} `;
                    pathData += `L ${toPos.cx},${toPos.top} `;

                } else if (fromPositions.length === 1) {
                    const fromPos = fromPositions[0];
                    const midX = (fromPos.cx + toPos.cx) / 2;

                    pathData += `M ${fromPos.cx},${fromPos.bottom} L ${fromPos.cx},${fromPos.bottom + 40} `;
                    pathData += `L ${midX},${fromPos.bottom + 40} `;
                    pathData += `L ${midX},${toPos.top - 40} `;
                    pathData += `L ${toPos.cx},${toPos.top - 40} `;
                    pathData += `L ${toPos.cx},${toPos.top} `;
                }

                path.setAttribute("d", pathData);

                // 子ノードの先/後に応じて線の色を設定
                const toEl = document.getElementById(toId);
                if (toEl) {
                    if (toEl.classList.contains('pair-first')) {
                        path.classList.add('line-red');
                    } else if (toEl.classList.contains('pair-second')) {
                        path.classList.add('line-blue');
                    }
                }

                svg.appendChild(path);
            }

            for (let i = 0; i < rounds.length - 1; i++) {
                const parentRound = rounds[i + 1];
                let activePairsCount = 0;
                parentRound.forEach(n => {
                    if (n.participants && n.participants.length > 0) activePairsCount++;
                });

                let pairCounter = 0;
                parentRound.forEach((parentNode) => {
                    if (parentNode.participants && parentNode.participants.length > 0) {
                        const childIds = parentNode.participants.map(p => p.uniqueId);
                        connectCards(childIds, parentNode.uniqueId, 0, pairCounter, activePairsCount);
                        pairCounter++;
                    }
                });
            }
        }
