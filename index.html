<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家系図ジェネレーター</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/app.css?v=20260916-3">
</head>

<body>

    <div class="history-sidebar">
        <div class="history-header">
            履歴
            <button class="history-clear-btn menu-button menu-button-small menu-button-danger" id="history-clear-btn">全削除</button>
        </div>
        <div class="history-list" id="history-list">
            <div class="history-new-item" id="history-new-btn">
                <span class="history-new-item-icon">＋</span> 新規作成
            </div>
            <div class="history-empty" id="history-empty">まだ履歴がありません。<br>家系図を生成すると<br>ここに保存されます。</div>
        </div>
        <div class="history-actions" style="display: none;">
        </div>
        <input type="file" id="history-import-file" accept=".json" style="display: none;">
    </div>

    <div class="container">
        <div class="app-header">
            <h1>家系図ジェネレーター</h1>
            <button class="theme-toggle" id="theme-toggle" title="テーマ切替"></button>
        </div>
        <div class="textarea-container">
            <textarea id="rsid-input" placeholder="RSIDを貼り付けてください"></textarea>
        </div>
        <div class="button-group primary-actions">
            <button id="paste-btn" class="menu-button"><span class="step-number">①</span>貼り付け</button>
            <button id="generate-btn" class="menu-button menu-button-gold"><span class="step-number">②</span>家系図を生成</button>
            <button id="clear-btn" class="menu-button menu-button-muted">入力をクリア</button>
            <button id="collapse-all-btn" class="menu-button">すべて折りたたむ</button>
        </div>
        <div class="player-id-area">
            <div class="conversion-layout">
                <!-- 左に大きく配置する変換ボタン -->
                <button id="convert-rsid-btn" class="menu-button">
                    <span class="step-number">③</span>プレイヤーIDを用いて変換
                </button>
                <div id="spinner" class="loading-spinner" style="display: none; align-self: center;"></div>

                <!-- 右側の入力・セレクトエリア -->
                <div class="conversion-fields">
                    <div class="player-id-row">
                        <label for="player-id-input">プレイヤーID:</label>
                        <select class="player-id-select" id="player-id-select">
                            <option value="">-- 手動入力 --</option>
                        </select>
                        <input type="text" id="player-id-input" placeholder="例: cc0db7" maxlength="6">
                    </div>

                    <!-- プルダウンの下に配置する登録ボタンとフォーム -->
                    <div class="registration-layout">
                        <div class="registration-actions">
                            <button id="show-register-btn" class="menu-button menu-button-small">
                                ＋ ID登録
                            </button>
                            <button id="pid-del-btn" class="menu-button menu-button-small menu-button-danger" style="display: none;">削除</button>
                        </div>

                        <div class="player-id-manage-row" id="player-id-manage-row" style="display: none;">
                            <input type="text" id="pid-name-input" placeholder="名前 (例: 自分)">
                            <input type="text" id="pid-id-input" placeholder="ID (例: cc0db7)" maxlength="6">
                            <button class="pid-add-btn menu-button menu-button-small" id="pid-add-btn">登録を確定</button>
                        </div>
                    </div>
                </div>
            </div>
            <div id="progress-container">
                <div id="progress-bar-wrapper">
                    <div id="progress-bar"></div>
                </div>
                <span id="progress-text">準備中...</span>
            </div>
        </div>
        <details class="save-share-panel">
            <summary>保存・共有</summary>
            <div class="save-share-content">
                <div class="webhook-settings">
                    <label for="webhook-url-input">Webhook URL:</label>
                    <input type="url" id="webhook-url-input" placeholder="https://discord.com/api/webhooks/...">
                    <button id="webhook-save-btn" class="menu-button menu-button-small">保存</button>
                    <span id="webhook-status"></span>
                </div>
                <div class="button-group">
                    <button id="save-btn" class="menu-button">画像として保存</button>
                    <button id="webhook-share-btn" class="menu-button">Webhookで共有</button>
                    <button id="history-export-btn" class="menu-button">jsonでエクスポート</button>
                    <button id="history-import-btn" class="menu-button">jsonでインポート</button>
                </div>
            </div>
        </details>
        <p id="hyperion-transfer-status" role="status" aria-live="polite" hidden></p>
        <p id="error-message"></p>
        <div class="bracket-container" id="bracket-container">
            <svg id="bracket-lines"></svg>
        </div>
    </div>

    <div id="modal-overlay" class="modal-overlay">
        <span id="close-modal">&times;</span>
        <button id="modal-prev" class="modal-nav-btn modal-nav-prev" title="前へ">&#10094;</button>
        <div id="modal-inner-wrapper">
            <div id="modal-name" class="modal-name"></div>
            <div id="modal-content"></div>
            <div id="modal-counter" class="modal-counter"></div>
        </div>
        <button id="modal-next" class="modal-nav-btn modal-nav-next" title="次へ">&#10095;</button>
    </div>

    <div id="global-history-tooltip" class="history-tooltip"></div>

    <script src="./js/face-renderer.js?v=20260915-1"></script>
    <script src="./js/sp-aura.js?v=20260915-4"></script>
    <script src="./js/hyperion-core.js?v=20260912-1"></script>
    <script src="./js/status-summary.js?v=20260916-3"></script>
    <script src="./js/status-effects-panel.js?v=20260916-5"></script>
    <script src="./js/hyperion-transfer.js?v=20260912-1"></script>
    <script src="./js/app.js?v=20260915-1"></script>
</body>

</html>
