                    if (card && !card.classList.contains('collapsed')) {
                        const nameEl = card.querySelector('.name');
                        let name = '';
                        if (nameEl) {
                            // birth-complete-label を除外して名前を取得
                            name = Array.from(nameEl.childNodes)
                                .filter(n => !n.classList || !n.classList.contains('birth-complete-label'))
                                .map(n => n.textContent)
                                .join('')
                                .trim();
                        }
                        qrList.push({
                            id: el.dataset.id,
                            name: name,
                            faceStatusText: nodesMap.get(card.id)?.faceStatusText || '',
                            element: el
                        });
                    }
                });
            }

            /**
             * 指定インデックスのQRをモーダルに表示する
             */
            function showQrAtIndex(index) {
                if (index < 0 || index >= qrList.length) return;
                currentQrIndex = index;
                const item = qrList[index];

                // QRコード生成
                const qrContainer = document.createElement('div');
                qrContainer.className = 'modal-qr-code';
                const facePreview = document.createElement('div');
                facePreview.className = 'face-preview-container modal-face-preview';
                modalContent.innerHTML = '';
                modalContent.append(facePreview, qrContainer);
                if (item.faceStatusText) {
                    const canvas = document.createElement('canvas');
                    canvas.className = 'face-preview-canvas';
                    canvas.width = canvas.height = 192;
                    canvas.setAttribute('aria-label', `${item.name || item.id}の顔プレビュー`);
                    facePreview.appendChild(canvas);
                    facePreview.classList.add('is-loading');
                    // A new element per QR prevents a delayed render from painting the next individual's face.
                    currentFaceRenderPromise = currentFaceRenderPromise.catch(() => {}).then(() => renderFacePreview(facePreview, item.faceStatusText, true));
                } else {
                    facePreview.classList.add('is-unavailable');
                    facePreview.textContent = '外見情報なし';
                }
                const alphanumericOnlyQrData = item.id.replace(/[^a-zA-Z0-9]/g, '');
                new QRCode(qrContainer, {
                    text: alphanumericOnlyQrData,
                    width: 400,
                    height: 400
                });

                // 個体名を表示
                modalNameEl.textContent = item.name || item.id;

                // カウンターを表示
                modalCounterEl.textContent = `${index + 1} / ${qrList.length}`;

                // ナビボタンの表示/非表示
                prevBtn.style.visibility = index > 0 ? 'visible' : 'hidden';
                nextBtn.style.visibility = index < qrList.length - 1 ? 'visible' : 'hidden';
            }

            // QRコードクリックでモーダルを開く
            document.getElementById('bracket-container').addEventListener('click', (event) => {
                const qrEl = event.target.closest('.qr-code');
                if (!qrEl) return;
                event.stopPropagation();
                const qrData = qrEl.dataset.id;
                if (qrData) {
                    buildQrList();
                    // クリックされたQRのインデックスを検索
                    const clickedIndex = qrList.findIndex(q => q.element === qrEl);
                    if (clickedIndex === -1) return;

                    showQrAtIndex(clickedIndex);
                    modalOverlay.style.display = 'flex';
                    document.getElementById('bracket-container').classList.add('qr-blur-active');
                }
            }, listenerOptions);

            // ナビゲーションボタン
            prevBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (currentQrIndex > 0) {
                    showQrAtIndex(currentQrIndex - 1);
                }
            }, listenerOptions);

            nextBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (currentQrIndex < qrList.length - 1) {
                    showQrAtIndex(currentQrIndex + 1);
                }
            }, listenerOptions);

            // キーボードナビゲーション
            document.addEventListener('keydown', (e) => {
                if (modalOverlay.style.display !== 'flex') return;
                if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (currentQrIndex > 0) showQrAtIndex(currentQrIndex - 1);
                } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (currentQrIndex < qrList.length - 1) showQrAtIndex(currentQrIndex + 1);
                } else if (e.key === 'Escape') {
                    closeModal();
                }
            }, listenerOptions);

            closeModalBtn.addEventListener('click', closeModal, listenerOptions);
            modalOverlay.addEventListener('click', (event) => {
                if (event.target === modalOverlay) {
                    closeModal();
                }
            }, listenerOptions);
        }

        function getAllAncestorIds(node, nodesMap) {
            let ancestors = new Set();
            function find(currentNode) {
                if (!currentNode || !currentNode.participants || currentNode.participants.length === 0) return;
                for (const parent of currentNode.participants) {
                    ancestors.add(parent.uniqueId);
                    const parentNode = nodesMap.get(parent.uniqueId);
                    if (parentNode) {
                        find(parentNode);
                    }
                }
            }
            find(node);
            return ancestors;
        }

        function updateAllVisibility(nodesMap) {
            const allNodeElements = document.querySelectorAll('.player-card');
            const hiddenNodeIds = new Set();

            document.querySelectorAll('[data-collapsed="true"]').forEach(collapsedNodeEl => {
                const node = nodesMap.get(collapsedNodeEl.id);
                if (node) {
                    const ancestorIds = getAllAncestorIds(node, nodesMap);
                    ancestorIds.forEach(id => hiddenNodeIds.add(id));
                }
            });

            allNodeElements.forEach(el => {
                if (hiddenNodeIds.has(el.id)) {
                    el.classList.add('collapsed');
                } else {
                    el.classList.remove('collapsed');
                }
            });

            requestAnimationFrame(() => {
                drawLines(currentRoundsData);
            });
        }

        function setupCollapseInteraction(nodesMap) {
            document.querySelectorAll('.collapsible').forEach(card => {
                card.addEventListener('click', (event) => {
                    if (event.target.closest('.qr-code')) {
                        return;
                    }

                    const cardEl = event.currentTarget;
                    const isCollapsed = cardEl.dataset.collapsed === 'true';

                    if (isCollapsed) {
                        delete cardEl.dataset.collapsed;
                        removeBirthCompleteLabel(cardEl);
                    } else {
                        cardEl.dataset.collapsed = 'true';
                        addBirthCompleteLabel(cardEl);
                    }

                    updateAllVisibility(nodesMap);
                    saveCollapseStateToHistory();
                });
            });
        }

        function setupHighlightInteraction(nodesMap) {
            const container = document.getElementById('bracket-container');
            if (!container) return;

            const allPaths = () => container.querySelectorAll('#bracket-lines path');
            const allCards = () => container.querySelectorAll('.player-card');

            document.querySelectorAll('.player-card').forEach(card => {
                card.addEventListener('mouseenter', () => {
                    container.classList.add('highlight-active');

                    const currentId = card.id;
                    const node = nodesMap.get(currentId);
                    if (!node) return;

                    card.classList.add('highlight-focus');

                    if (node.participants.length > 0) {
                        const myBirthPath = document.getElementById(`path-for-${currentId}`);
                        if (myBirthPath) myBirthPath.classList.add('highlight-focus');

                        node.participants.forEach(parent => {
                            const parentCard = document.getElementById(parent.uniqueId);
                            if (parentCard) parentCard.classList.add('highlight-focus');
                        });
                    }

                    if (node.parentId) {
                        const childNode = nodesMap.get(node.parentId);
                        if (childNode) {
                            const childCard = document.getElementById(childNode.uniqueId);
                            if (childCard) childCard.classList.add('highlight-focus');

                            const myCreationPath = document.getElementById(`path-for-${childNode.uniqueId}`);
                            if (myCreationPath) myCreationPath.classList.add('highlight-focus');

                            const pairNode = childNode.participants.find(p => p.uniqueId !== currentId);
                            if (pairNode) {
                                const pairCard = document.getElementById(pairNode.uniqueId);
                                if (pairCard) pairCard.classList.add('highlight-focus');
                            }
                        }
                    }
                });

                card.addEventListener('mouseleave', () => {
                    container.classList.remove('highlight-active');
                    allPaths().forEach(p => p.classList.remove('highlight-focus'));
                    allCards().forEach(c => c.classList.remove('highlight-focus'));
                });
            });
        }


        function renderFamilyTree(input, options = {}) {
            input = input.trim();
            const binary = options.hyperion || (activeHyperion?.parsed.treeText.trim() === input ? activeHyperion : null);
            const errorEl = document.getElementById('error-message');
            const container = document.getElementById('bracket-container');
            errorEl.style.display = 'none';
            if (!input) return false;

            try {
                let stringToParse = input;
                let statusString = '';
                let formattedStatus = '';
                const treeForCheck = binary ? structuredClone(binary.parsed.tree) : parseNode(stringToParse);
                const winnerName = treeForCheck.name;

                // 「頭:」「アンテナ:」のうち、先に現れる位置から全ステータスを取り出す
                const statusStartIndex = window.DenpamenFaceRenderer.findStatusStart(winnerName);

                if (statusStartIndex !== -1) {
                    statusString = winnerName.substring(statusStartIndex);
                    const winnerNameOnly = winnerName.substring(0, statusStartIndex).trim();
                    const lastWinnerNameIndex = stringToParse.lastIndexOf(winnerName);
                    stringToParse = stringToParse.substring(0, lastWinnerNameIndex) + winnerNameOnly;
                }
                if (binary) {
                    statusString = binary.parsed.statusText;
                    binary.parsed.appearanceComplete &&= window.DenpamenFaceRenderer.hasCompleteAppearance(statusString);
                }
                if (statusString) {
                    let tempStatus = statusString;
                    tempStatus = tempStatus.replace(
                        /(色:)([\s\S]*?)(?=(?:柄:|髪:|髪色:|肌色:|眉:|目:|鼻:|頬:|口:)|$)/,
                        (match, colorKeyword, colorText) => {
                            const processedText = colorText.trim().replace(/\s+/g, '&');
                            return colorKeyword + processedText + '\n';
                        }
                    );
                    formattedStatus = tempStatus.replace(/\s+/g, '\n').trim();
                }

                const tree = binary ? treeForCheck : parseNode(stringToParse);
                const roundsData = [];
                let nodeCount = 0;

                function assignDepthAndId(node, depth, parentId = null) {
                    if (depth > HyperionCore.LIMITS.depth || ++nodeCount > HyperionCore.LIMITS.cards) throw new Error('家系図の表示上限を超えています。');
                    if (!roundsData[depth]) roundsData[depth] = [];
                    node.uniqueId = `d${depth}_${roundsData[depth].length}`;
                    node.parentId = parentId;
                    // リーフノードの場合、元のRSIDを保持する
                    if (!node.participants || node.participants.length === 0) {
                        node.originalId = node.id;
                    }
                    roundsData[depth].push(node);
                    node.participants.forEach(p => assignDepthAndId(p, depth + 1, node.uniqueId));
                }

                assignDepthAndId(tree, 0);
                const reversedRounds = [...roundsData].reverse();

                const preparedNodesMap = new Map(reversedRounds.flat().map(node => [node.uniqueId, node]));
                const appearanceRecords = new Map((binary?.parsed.records || []).map(record => [record.sourceIndex, record]));
                for (const node of preparedNodesMap.values()) {
                    const record = appearanceRecords.get(node.sourceIndex);
                    const faceStatus = binary ? (record?.appearanceComplete ? record.statusText : '') : (node === tree ? statusString : '');
                    node.faceStatusText = window.DenpamenFaceRenderer.hasCompleteAppearance(faceStatus) ? faceStatus : '';
                }
                const ancestorFaces = [];

                let html = "";
                let cardCounter = 0;
                reversedRounds.forEach((round, i) => {
                    const isChampionRound = i === reversedRounds.length - 1;
                    html += `<div class="round">`;
                    html += round.map(node => {

                        let pairName = "なし";
                        let childName = "なし";
                        let pairClass = '';

                        // ★追加: 親の名前を取得する処理
                        let parentsText = "なし";
                        if (node.participants && node.participants.length > 0) {
                            parentsText = node.participants.map(p => p.name.split(' ')[0]).join(' + ');
                        }

                        if (node.parentId) {
                            const childNode = preparedNodesMap.get(node.parentId);
                            if (childNode) {
                                childName = childNode.name.split(' ')[0];
                                if (childNode.participants.length === 2) {
                                    const pairNode = childNode.participants.find(p => p.uniqueId !== node.uniqueId);
                                    if (pairNode) {
                                        pairName = pairNode.name.split(' ')[0];
                                    }

                                    if (childNode.participants[0].uniqueId === node.uniqueId) {
                                        pairClass = ' pair-first';
                                    } else if (childNode.participants[1].uniqueId === node.uniqueId) {
                                        pairClass = ' pair-second';
                                    }
                                }
                            }
                        }

                        // ★変更: 親:◯◯ を表示に追加
                        const relationHtml = `
                        <div class="relation-info">
                            <div>親: ${escapeHtml(parentsText)}</div>
                            <div>ペア: ${escapeHtml(pairName)}</div>
                            <div>子: ${escapeHtml(childName)}</div>
                        </div>`;

                        let nameSuffix = '';
                        if (pairClass.includes('pair-first')) nameSuffix = '(先)';
                        else if (pairClass.includes('pair-second')) nameSuffix = '(後)';

                        let cardStyle = ``;
                        const isLeafNode = !node.participants.length;
                        const collapsibleClass = !isLeafNode ? ' collapsible' : '';
                        const qrHtml = isLeafNode && HyperionCore.normalRsid(node.id) ? `<div class="qr-code" data-id="${node.id}"></div><div class="rsid-text">${node.id}</div>` : '';
                        let ancestorFaceHtml = '';
                        if (!isChampionRound && binary) {
                            const record = appearanceRecords.get(node.sourceIndex);
                            const complete = !!record?.appearanceComplete && window.DenpamenFaceRenderer.hasCompleteAppearance(record.statusText);
                            ancestorFaces.push({ id: node.uniqueId, complete, statusText: record?.statusText || '' });
                            ancestorFaceHtml = complete
                                ? `<div class="face-preview-container ancestor-face-preview is-loading"><canvas class="face-preview-canvas" width="1" height="1" aria-label="${escapeHtml(node.name)}の顔プレビュー"></canvas></div>`
                                : '<div class="face-preview-container ancestor-face-preview is-unavailable" role="img" aria-label="外見情報なし" title="外見情報が不足しているか、未対応の顔パーツがあります。元データは保持されています。"></div>';
                        }

                        const cardHtml = isChampionRound ?
                            `<div class="player-card champion-card${collapsibleClass}${pairClass}" id="${node.uniqueId}" style="${cardStyle}">
                            <div class="face-preview-container"><canvas class="face-preview-canvas" width="1024" height="1024" aria-label="最終個体の顔プレビュー"></canvas></div>
                            <div class="color-info-container"> <div class="color-info-item">髪色<div class="color-preview-box hair-color-box"></div></div> <div class="color-info-item">肌色<div class="color-preview-box skin-color-box"></div></div> </div>
                            <div class="custom-color-palette"></div>
                            <div class="name">${escapeHtml(node.name).replace(' ', '<br>')}${nameSuffix}</div>
                            ${relationHtml}
                            ${formattedStatus ? `<div class="status">${escapeHtml(formattedStatus)}</div>` : ''}
                            ${qrHtml}
                        </div>`
                            :
                            `<div class="player-card${collapsibleClass}${pairClass}" id="${node.uniqueId}" style="${cardStyle}">
                            ${ancestorFaceHtml}
                            <div class="name">${escapeHtml(node.name)}${nameSuffix}</div>
                            ${relationHtml}
                            ${qrHtml}
                        </div>`;

                        cardCounter++;
                        return cardHtml;
                    }).join('');
                    html += `</div>`;
                });
                // Build QR elements before replacing the visible tree, so a failed receive preserves it.
                const prepared = document.createElement('div');
                prepared.innerHTML = '<svg id="bracket-lines"></svg>' + html;
                prepared.querySelectorAll('.qr-code').forEach(el => {
                    new QRCode(el, { text: el.dataset.id, width: 150, height: 150 });
                });
                resetConversionUI();
                currentRoundsData = reversedRounds;
                nodesMap = preparedNodesMap;
                container.replaceChildren(...prepared.childNodes);

                document.querySelectorAll('.round').forEach(roundEl => {
                    const count = roundEl.querySelectorAll('.player-card').length;
                    if (count >= 12) { roundEl.classList.add('is-super-crowded'); }
                    else if (count >= 8) { roundEl.classList.add('is-crowded'); }
                    else if (count >= 4) { roundEl.classList.add('is-dense'); }
                });

                setupQRCodeModal();
                setupCollapseInteraction(nodesMap);
                setupHighlightInteraction(nodesMap);

                const championNode = reversedRounds[reversedRounds.length - 1][0];
                if (championNode) {
                    applyFaceColorSwatches(championNode.uniqueId, statusString);
                    applyAppearanceInfo(championNode.uniqueId, statusString);
                    if (binary && !binary.parsed.appearanceComplete) {
                        const preview = document.getElementById(championNode.uniqueId).querySelector('.face-preview-container');
                        preview.classList.add('is-error');
                        preview.title = '未対応の顔情報があります。元データは保持されています。';
                    } else {
                        const preview = document.getElementById(championNode.uniqueId).querySelector('.face-preview-container');
                        currentFaceRenderPromise = currentFaceRenderPromise.catch(() => {}).then(() => renderFacePreview(preview, statusString));
                    }
                }
                setupAncestorFaces(ancestorFaces);

                requestAnimationFrame(() => {
                    // アニメーションなしで即座に線を描画
                    drawLines(currentRoundsData);
                });

                // --- 履歴をIndexedDBに保存（履歴からの読み込み時はスキップ） ---
                if (!isLoadingFromHistory) {
                    if (options.newHistory || (activeHyperion && !binary)) currentActiveHistoryId = null;
                    activeHyperion = binary;
                    HyperionTransfer.setActiveBinary(binary?.binaryId);
                    const championName = tree.name || '名称不明';
                    if (!saveToHistory(championName, input, statusString)) {
                        options.warning = '履歴を保存できませんでした。再読み込み前に保存容量を確認してください。';
                        HyperionTransfer.status(options.warning, true);
                    }
                }
                isLoadingFromHistory = false;
                return true;

            } catch (e) {
                errorEl.textContent = "エラー: " + e.message;
                errorEl.style.display = 'block';
                isLoadingFromHistory = false;
                return false;
            }
        }

        document.getElementById('generate-btn').addEventListener('click', () => {
            ++hyperionNavigationVersion;
            renderFamilyTree(document.getElementById('rsid-input').value);
        });

        HyperionTransfer.install(async (parsed, binaryId) => {
            ++hyperionNavigationVersion;
            isLoadingFromHistory = false;
            const options = { hyperion: { parsed, binaryId }, newHistory: true };
            if (!renderFamilyTree(parsed.treeText, options)) throw new Error(document.getElementById('error-message').textContent);
            const input = document.getElementById('rsid-input');
            input.value = parsed.treeText;
            input.style.height = 'auto';
            input.style.height = `${input.scrollHeight}px`;
            return options.warning || '';
        });

        document.getElementById('clear-btn').addEventListener('click', () => {
            cleanupQRCodeModal?.();
            ++hyperionNavigationVersion;
            if (activeHyperion) currentActiveHistoryId = null;
            activeHyperion = null;
            HyperionTransfer.setActiveBinary(null);
            void HyperionTransfer.collect();
            document.getElementById('rsid-input').value = '';
            document.getElementById('bracket-container').innerHTML = '<svg id="bracket-lines"></svg>';
            resetAncestorFaces();
            document.getElementById('error-message').style.display = 'none';
            // 変換UIもリセット
            resetConversionUI();
            currentRoundsData = [];
            nodesMap.clear();
        });

        document.getElementById('collapse-all-btn').addEventListener('click', () => {
            if (!nodesMap || nodesMap.size === 0) {
                alert('先に家系図を生成してください。');
                return;
            }

            const collapsibleNodes = document.querySelectorAll('.collapsible');
            if (collapsibleNodes.length === 0) return;

            collapsibleNodes.forEach(card => {
                card.dataset.collapsed = 'true';
                addBirthCompleteLabel(card);
            });

            updateAllVisibility(nodesMap);
            saveCollapseStateToHistory();
        });

        document.getElementById('save-btn').addEventListener('click', async () => {
            const container = document.getElementById('bracket-container');
            if (container.children.length <= 1) {
                alert('先に家系図を生成してください。');
                return;
            }

            await ensureTreeFacesRendered();
            drawLines(currentRoundsData);
            container.classList.add('screenshot-mode');

            setTimeout(() => {
                html2canvas(container, {
                    useCORS: true, scale: 3, backgroundColor: "#2c2c3e", imageSmoothingEnabled: false,
                    scrollX: 0,
                    scrollY: 0,
                    width: container.scrollWidth,
                    height: container.scrollHeight,
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.href = canvas.toDataURL('image/png');
                    link.download = 'family-tree.png';
                    link.click();
                }).finally(() => {
                    container.classList.remove('screenshot-mode');
                    drawLines(currentRoundsData);
                });
            }, 300);
        });

        const textarea = document.getElementById('rsid-input');
        textarea.addEventListener('input', () => { textarea.style.height = 'auto'; textarea.style.height = `${textarea.scrollHeight}px`; });

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                drawLines(currentRoundsData);
            }, 200);
        });

        let scrollTimer;
        document.getElementById('bracket-container').addEventListener('scroll', () => {
            clearTimeout(scrollTimer);
            scrollTimer = setTimeout(() => {
                drawLines(currentRoundsData);
            }, 100);
        });

        document.getElementById('convert-rsid-btn').addEventListener('click', () => {
            const errorEl = document.getElementById('error-message');
            const spinner = document.getElementById('spinner');
            const convertBtn = document.getElementById('convert-rsid-btn');
            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');
            const playerIdHex = document.getElementById('player-id-input').value.trim();

            if (!playerIdHex) {
                errorEl.style.color = '#f96666'; // エラー色にリセット
                errorEl.textContent = "エラー：プレイヤーIDを入力してください。";
                errorEl.style.display = 'block';
                return;
            }

            try {
                Number(hexToBigInt(playerIdHex));
            } catch (e) {
                errorEl.style.color = '#f96666'; // エラー色にリセット
                errorEl.textContent = "エラー：プレイヤーIDは正しい16進数（例: cc0db7）で入力してください。";
                errorEl.style.display = 'block';
                return;
            }

            if (!currentRoundsData || currentRoundsData.length === 0) {
                errorEl.style.color = '#f96666'; // エラー色にリセット
                errorEl.textContent = "エラー：先に家系図を生成してください。";
                errorEl.style.display = 'block';
                return;
            }

            // UIの状態を更新
            errorEl.style.display = 'none';
            spinner.style.display = 'block';
            convertBtn.disabled = true;
            progressContainer.style.display = 'block';
            progressBar.style.width = '0%';
            progressText.textContent = '準備中...';

            // 現在の変換セッションIDを記録
            const thisSessionId = ++conversionSessionId;

            // キャッシュ機能の準備
            let cache; try { cache = JSON.parse(localStorage.getItem('rsidConversionCache')); } catch(e){} if(!cache) cache = {};
            if (!cache) cache = {};

            function saveToCache(updates) {
                Object.assign(cache, updates);
                try {
                    localStorage.setItem('rsidConversionCache', JSON.stringify(cache));
                } catch (e) {
                    console.error('キャッシュの保存に失敗しました:', e);
                }
            }

            function applyConvertedResults(results) {
                for (const result of results) {
                    if (result.newId) {
                        // 注意: node.id（元のRSID）は書き換えない。表示のみ更新する。
                        const cardEl = document.getElementById(result.uniqueId);
                        if (cardEl) {
                            const rsidTextEl = cardEl.querySelector('.rsid-text');
                            if (rsidTextEl) {
                                rsidTextEl.textContent = result.newId;
                            }
                            const qrEl = cardEl.querySelector('.qr-code');
                            if (qrEl) {
                                qrEl.innerHTML = '';
                                qrEl.dataset.id = result.newId;
                                const alphanumericOnlyId = result.newId.replace(/[^a-zA-Z0-9]/g, '');
                                new QRCode(qrEl, {
                                    text: alphanumericOnlyId,
                                    width: 150,
                                    height: 150
                                });
                            }
                        }
                    }
                }
            }

            // リーフノードを収集（常に originalId を使って変換する）
            const leafNodesToConvert = [];
            const cachedResults = [];
            for (const round of currentRoundsData) {
                for (const node of round) {
                    if (!node.participants || node.participants.length === 0) {
                        // originalId を使用（元のRSIDを基に変換）
                        const rsidForConversion = node.originalId || node.id;
                        if (!rsidForConversion) continue;

                        const cacheKey = `${playerIdHex}_${rsidForConversion}`;
                        if (cache[cacheKey]) {
                            cachedResults.push({ uniqueId: node.uniqueId, newId: cache[cacheKey], id: rsidForConversion });
                        } else {
                            leafNodesToConvert.push({ uniqueId: node.uniqueId, id: rsidForConversion });
                        }
                    }
                }
            }

            // キャッシュ済みの結果を即反映
            if (cachedResults.length > 0) {
                applyConvertedResults(cachedResults);
            }

            // 全てキャッシュにあった場合
            if (leafNodesToConvert.length === 0) {
                if (thisSessionId !== conversionSessionId) return; // 別の家系図に切り替え済み
                progressBar.style.width = '100%';
                progressText.textContent = '変換完了';
                spinner.style.display = 'none';
                convertBtn.disabled = false;
                errorEl.style.color = '#3ce4c8';
                errorEl.textContent = '全QRコードの変換が完了しました';
                errorEl.style.display = 'block';

                if (currentActiveHistoryId) {
                    saveConvertedPlayerIdToHistory(currentActiveHistoryId, playerIdHex);
                }
                return;
            }

            // 既存のWorkerがあれば終了
            if (rsidWorker) {
                rsidWorker.terminate();
            }

            // Web Workerを起動
            rsidWorker = new Worker('rsid-worker.js');

            let progressUpdateCounter = 0;

            rsidWorker.onmessage = (event) => {
                const data = event.data;

                // 別の家系図に切り替え済みならコールバックを無視
                if (thisSessionId !== conversionSessionId) {
                    rsidWorker.terminate();
                    rsidWorker = null;
                    return;
                }

                if (data.type === 'progress') {
                    progressUpdateCounter++;
                    if (progressUpdateCounter % 5 === 0 || data.current === data.total) {
                        requestAnimationFrame(() => {
                            const percent = Math.round((data.current / data.total) * 100);
                            progressBar.style.width = percent + '%';
                            progressText.textContent = data.message;
                        });
                    }
                } else if (data.type === 'result') {
                    const convertedNodes = data.convertedNodes;

                    // 新規変換結果をキャッシュに保存（originalId ベースのキーを使用）
                    const newCacheEntries = {};
                    for (const result of convertedNodes) {
                        if (result.newId) {
                            const originalNode = leafNodesToConvert.find(n => n.uniqueId === result.uniqueId);
                            if (originalNode && originalNode.id) {
                                // originalNode.id は元のRSID（originalId）が入っている
                                newCacheEntries[`${playerIdHex}_${originalNode.id}`] = result.newId;
                            }
                        }
                    }
                    saveToCache(newCacheEntries);

                    // 変換結果を反映
                    applyConvertedResults(convertedNodes);

                    // 完了表示
                    requestAnimationFrame(() => {
                        if (thisSessionId !== conversionSessionId) return; // 別の家系図に切り替え済み
                        progressBar.style.width = '100%';
                        progressText.textContent = '変換完了';
                        spinner.style.display = 'none';
                        convertBtn.disabled = false;
                        errorEl.style.color = '#3ce4c8'; // 成功色
                        errorEl.textContent = '全QRコードの変換が完了しました';
                        errorEl.style.display = 'block';

                        if (currentActiveHistoryId) {
                            saveConvertedPlayerIdToHistory(currentActiveHistoryId, playerIdHex);
                        }
                    });

                    // Workerを終了
                    rsidWorker.terminate();
                    rsidWorker = null;
                }
            };

            rsidWorker.onerror = (error) => {
                console.error('Worker error:', error);
                requestAnimationFrame(() => {
                    spinner.style.display = 'none';
                    convertBtn.disabled = false;
                    progressContainer.style.display = 'none';
                    errorEl.style.color = '#f96666'; // エラー色
                    errorEl.textContent = "エラー：変換処理中に予期しない問題が発生しました。";
                    errorEl.style.display = 'block';
                });
                rsidWorker.terminate();
                rsidWorker = null;
            };

            // Workerにデータを送信して変換開始
            rsidWorker.postMessage({
                type: 'convert',
                leafNodes: leafNodesToConvert,
                playerIdHex: playerIdHex
            });
        });

        // --- Discord Webhook機能 ---

        // localStorage からWebhook URLを復元
        const savedWebhookUrl = localStorage.getItem('webhookUrl');
        if (savedWebhookUrl) {
            document.getElementById('webhook-url-input').value = savedWebhookUrl;
            document.getElementById('webhook-status').textContent = '✓ 保存済み';
            document.getElementById('webhook-status').style.color = '#3ce4c8';
        }

        // Webhook URL保存ボタン
        document.getElementById('webhook-save-btn').addEventListener('click', () => {
            const url = document.getElementById('webhook-url-input').value.trim();
            const statusEl = document.getElementById('webhook-status');
            if (!url) {
                localStorage.removeItem('webhookUrl');
                statusEl.textContent = 'URLが空のため削除しました';
                statusEl.style.color = '#f96666';
                return;
            }
            if (!url.startsWith('https://discord.com/api/webhooks/') && !url.startsWith('https://discordapp.com/api/webhooks/')) {
                statusEl.textContent = '⚠ 無効なWebhook URL';
                statusEl.style.color = '#f96666';
                return;
            }
            localStorage.setItem('webhookUrl', url);
            statusEl.textContent = '✓ 保存しました';
            statusEl.style.color = '#3ce4c8';
        });

        // Webhookで共有ボタン
        document.getElementById('webhook-share-btn').addEventListener('click', async () => {
            const container = document.getElementById('bracket-container');
            const errorEl = document.getElementById('error-message');

            if (container.children.length <= 1) {
                alert('先に家系図を生成してください。');
                return;
            }

            const webhookUrl = document.getElementById('webhook-url-input').value.trim() || localStorage.getItem('webhookUrl');
            if (!webhookUrl) {
                alert('Webhook URLを入力して保存してください。');
                return;
            }

            // ボタンの状態を変更
            const webhookBtn = document.getElementById('webhook-share-btn');
            const originalText = webhookBtn.textContent;
            webhookBtn.textContent = '送信中...';
            webhookBtn.disabled = true;

            try {
                await ensureTreeFacesRendered();
                // スクリーンショットモードに切り替え
                drawLines(currentRoundsData);
                container.classList.add('screenshot-mode');

                // html2canvasで画像をキャプチャ
                await new Promise(resolve => setTimeout(resolve, 300));
                const canvas = await html2canvas(container, {
                    useCORS: true,
                    scale: 3,
                    backgroundColor: "#2c2c3e",
                    imageSmoothingEnabled: false,
                    scrollX: 0,
                    scrollY: 0,
                    width: container.scrollWidth,
                    height: container.scrollHeight,
                });

                container.classList.remove('screenshot-mode');
                drawLines(currentRoundsData);

                // Canvas → Blob に変換
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));

                // JSONエクスポートデータを生成
                const history = getHistory();
                const playerIds = getSavedPlayerIds();
                const exportData = { history, playerIds };
                const jsonStr = JSON.stringify(exportData, null, 2);
                const jsonBlob = new Blob([jsonStr], { type: 'application/json' });
                
                // 現在時刻でファイル名を作成
                const now = new Date();
                const dateStr = `${now.getFullYear()}${(now.getMonth() + 1).toString().padStart(2, '0')}${now.getDate().toString().padStart(2, '0')}_${now.getHours().toString().padStart(2, '0')}${now.getMinutes().toString().padStart(2, '0')}`;
                const jsonFileName = `kakeizu_data_${dateStr}.json`;

                // FormDataに画像とJSONを添付して送信
                const formData = new FormData();
                formData.append('files[0]', blob, 'family-tree.png');
                formData.append('files[1]', jsonBlob, jsonFileName);

                // Webhookに送信
                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    errorEl.style.color = '#3ce4c8'; // 成功色
                    errorEl.textContent = '✓ Discordへの送信に成功しました！';
                    errorEl.style.display = 'block';
                } else {
                    const errorText = await response.text();
                    console.error('Webhook送信エラー:', response.status, errorText);
                    errorEl.style.color = '#f96666'; // エラー色
                    errorEl.textContent = `エラー：Discordへの送信に失敗しました (HTTP ${response.status})`;
                    errorEl.style.display = 'block';
                }
            } catch (e) {
                console.error('Webhook送信中にエラー:', e);
                container.classList.remove('screenshot-mode');
                errorEl.style.color = '#f96666'; // エラー色
                errorEl.textContent = "エラー：Webhook送信中に問題が発生しました。URLを確認してください。";
                errorEl.style.display = 'block';
            } finally {
                webhookBtn.textContent = originalText;
                webhookBtn.disabled = false;
            }
        });

        // =============================================================
        // --- クリップボードから貼り付けボタン ---
        // =============================================================
        document.getElementById('paste-btn').addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                const textarea = document.getElementById('rsid-input');
                textarea.value = text;
                textarea.style.height = 'auto';
                textarea.style.height = `${textarea.scrollHeight}px`;
            } catch (err) {
                // HTTPS環境でない場合やユーザーが拒否した場合
                alert('クリップボードの読み取りに失敗しました。\n手動で貼り付け (Ctrl+V) してください。');
            }
        });

        // =============================================================
        // --- ダークモード / ライトモード切り替え ---
        // =============================================================
        const THEME_KEY = 'appTheme';

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem(THEME_KEY, theme);
        }

        // 保存されたテーマを復元
        const savedTheme = localStorage.getItem(THEME_KEY) || 'dark';
        if (savedTheme === 'light') {
            applyTheme('light');
        }

        document.getElementById('theme-toggle').addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            applyTheme(current === 'light' ? 'dark' : 'light');
        });

        // =============================================================
        // --- プレイヤーID記憶 & 複数登録 ---
        // =============================================================        // --- プレイヤーID登録 (localStorage) ---
        const PLAYER_IDS_KEY = 'savedPlayerIds';
        const LAST_USED_ID_KEY = 'lastUsedPlayerId';

        function getSavedPlayerIds() {
            try {
                const raw = localStorage.getItem(PLAYER_IDS_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                return [];
            }
        }

        function renderPlayerIdDropdown() {
            const select = document.getElementById('player-id-select');
            const ids = getSavedPlayerIds();
            // 既存のオプションを初期化（最初の手動入力オプション以外）
            while (select.options.length > 1) {
                select.remove(1);
            }
            ids.forEach(entry => {
                const opt = document.createElement('option');
                opt.value = entry.id;
                opt.textContent = `${entry.name}: ${entry.id}`;
                select.appendChild(opt);
            });
        }

        // ドロップダウン変更時
        document.getElementById('player-id-select').addEventListener('change', (e) => {
            const val = e.target.value;
            if (val) {
                document.getElementById('player-id-input').value = val;
                document.getElementById('pid-del-btn').style.display = 'block';
            } else {
                document.getElementById('pid-del-btn').style.display = 'none';
            }
            localStorage.setItem(LAST_USED_ID_KEY, val);
        });

        // 手動入力時も保存
        document.getElementById('player-id-input').addEventListener('input', (e) => {
            localStorage.setItem(LAST_USED_ID_KEY, e.target.value);
            document.getElementById('player-id-select').value = '';
            document.getElementById('pid-del-btn').style.display = 'none';
        });

        // 削除ボタン
        document.getElementById('pid-del-btn').addEventListener('click', () => {
            const select = document.getElementById('player-id-select');
            const idToDelete = select.value;
            if (!idToDelete) return;
            if (!confirm(`登録済みのプレイヤーID「${idToDelete}」を削除しますか？`)) return;

            let ids = getSavedPlayerIds();
            ids = ids.filter(e => e.id !== idToDelete);
            localStorage.setItem(PLAYER_IDS_KEY, JSON.stringify(ids));

            renderPlayerIdDropdown();
            document.getElementById('player-id-input').value = '';
            document.getElementById('pid-del-btn').style.display = 'none';
            localStorage.removeItem(LAST_USED_ID_KEY);
        });

        // 登録ボタン
        document.getElementById('pid-add-btn').addEventListener('click', () => {
            const name = document.getElementById('pid-name-input').value.trim();
            const id = document.getElementById('pid-id-input').value.trim();
            if (!name || !id) {
                alert('名前とIDの両方を入力してください。');
                return;
            }
            if (id.length > 6) {
                alert('IDは6文字以内で入力してください。');
                return;
            }
            const ids = getSavedPlayerIds();
            // 重複チェック
            if (ids.some(e => e.id === id)) {
                alert('このIDは既に登録されています。');
                return;
            }
            ids.push({ name, id });
            localStorage.setItem(PLAYER_IDS_KEY, JSON.stringify(ids));
            renderPlayerIdDropdown();
            // フォームクリア
            document.getElementById('pid-name-input').value = '';
            document.getElementById('pid-id-input').value = '';
            // 追加したIDを自動選択
            document.getElementById('player-id-select').value = id;
            document.getElementById('player-id-input').value = id;
            document.getElementById('pid-del-btn').style.display = 'block';
            document.getElementById('player-id-manage-row').style.display = 'none';
            localStorage.setItem(LAST_USED_ID_KEY, id);
        });

        // ID登録フォームの表示切替
        document.getElementById('show-register-btn').addEventListener('click', () => {
            const row = document.getElementById('player-id-manage-row');
            row.style.display = row.style.display === 'none' ? 'flex' : 'none';
        });

        // 初期描画
        renderPlayerIdDropdown();

        // 前回使用したIDの復元
        const lastUsedId = localStorage.getItem(LAST_USED_ID_KEY);
        if (lastUsedId) {
            document.getElementById('player-id-input').value = lastUsedId;
            const select = document.getElementById('player-id-select');
            let optionExists = false;
            for (let i = 0; i < select.options.length; i++) {
                if (select.options[i].value === lastUsedId) {
                    optionExists = true;
                    break;
                }
            }
            if (optionExists) {
                select.value = lastUsedId;
                document.getElementById('pid-del-btn').style.display = 'block';
            }
        }

        // =============================================================
        // --- 履歴・プレイヤーIDのJSON形式エクスポート / インポート ---
        // =============================================================
        document.getElementById('history-export-btn').addEventListener('click', async () => {
            try {
            const history = getHistory();
            const playerIds = getSavedPlayerIds();
            if (history.length === 0 && playerIds.length === 0) {
                alert('エクスポートするデータがありません。');
                return;
            }
            const exportData = {
                schemaVersion: 2,
                history: history,
                playerIds: playerIds,
                hyperionBinaries: await HyperionTransfer.exportBinaries(history)
            };
            const dataStr = JSON.stringify(exportData, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const now = new Date();
            const dateStr = `${now.getFullYear()}${(now.getMonth() + 1).toString().padStart(2, '0')}${now.getDate().toString().padStart(2, '0')}`;
            a.download = `kakeizu_data_${dateStr}.json`;
            a.click();
            URL.revokeObjectURL(url);
            } catch (error) { alert('エクスポートに失敗しました: ' + error.message); }
        });

        document.getElementById('history-import-btn').addEventListener('click', () => {
            document.getElementById('history-import-file').click();
        });

        document.getElementById('history-import-file').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (ev) => {
                try {
                    const imported = JSON.parse(ev.target.result);
                    let importedHistory = [];
                    let importedPlayerIds = [];

                    if (Array.isArray(imported)) {
                        // 旧バージョンの履歴データフォーマット
                        importedHistory = imported;
                    } else if (imported && typeof imported === 'object') {
                        // 新フォーマット { history: [...], playerIds: [...] }
                        if (imported.history) importedHistory = imported.history;
                        if (imported.playerIds) importedPlayerIds = imported.playerIds;
                    } else {
                        throw new Error('無効なフォーマット');
                    }

                    if (!Array.isArray(importedHistory) || !Array.isArray(importedPlayerIds) || importedHistory.length > 1000) throw new Error('履歴またはプレイヤーIDの形式・件数が不正です');
                    // バリデーション - 履歴
                    for (const entry of importedHistory) {
                        if (!entry.id || !entry.name || typeof entry.data !== 'string') {
                            throw new Error('無効な履歴エントリが含まれています');
                        }
                        if (entry.hyperion && (typeof entry.hyperion.binaryId !== 'string' || !/^[a-f0-9]{64}$/.test(entry.hyperion.binaryId))) throw new Error('無効なバイナリ参照です');
                    }

                    // バリデーション - プレイヤーID
                    for (const entry of importedPlayerIds) {
                        if (!entry.id || !entry.name) {
                            throw new Error('無効なプレイヤーIDエントリが含まれています');
                        }
                    }

                    const importWarning = await HyperionTransfer.importBinaries(importedHistory, imported.hyperionBinaries);

                    // --- プレイヤーIDのマージ ---
                    const existingPids = getSavedPlayerIds();
                    const existingPidSet = new Set(existingPids.map(p => p.id));
                    let pidAddedCount = 0;
                    for (const entry of importedPlayerIds) {
                        if (!existingPidSet.has(entry.id)) {
                            existingPids.push(entry);
                            existingPidSet.add(entry.id);
                            pidAddedCount++;
                        }
                    }
                    if (pidAddedCount > 0) {
                        localStorage.setItem(PLAYER_IDS_KEY, JSON.stringify(existingPids));
                        renderPlayerIdDropdown();
                    }

                    // --- 履歴のマージ ---
                    const existingHistory = getHistory();
                    const existingHids = new Set(existingHistory.map(h => h.id));

                    let historyAddedCount = 0;
                    for (const entry of importedHistory) {
                        if (!existingHids.has(entry.id)) {
                            existingHistory.push(entry);
                            existingHids.add(entry.id);
                            historyAddedCount++;
                        }
                    }

                    // 最大件数制限
                    if (existingHistory.length > MAX_HISTORY) {
                        existingHistory.splice(MAX_HISTORY);
                    }

                    localStorage.setItem('rsidHistory', JSON.stringify(existingHistory));
                    renderHistoryList();
                    void HyperionTransfer.collect(existingHistory);
                    if (importWarning) HyperionTransfer.status(importWarning, true);

                    let msg = 'インポート完了:';
                    if (historyAddedCount > 0) msg += `\n・履歴を ${historyAddedCount} 件追加`;
                    if (pidAddedCount > 0) msg += `\n・プレイヤーIDを ${pidAddedCount} 件追加`;
                    if (historyAddedCount === 0 && pidAddedCount === 0) msg += '\n・新しい追加データはありませんでした（重複をスキップ）';
                    alert(msg);
                } catch (err) {
                    alert('インポートに失敗しました: ' + err.message);
                } finally { HyperionTransfer.finishImport(); }
            };
            reader.readAsText(file);
            // ファイル入力をリセット（同じファイルを再選択可能にする）
            e.target.value = '';
        });


    </script>
</body>

</html>
